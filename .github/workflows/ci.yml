# SPDX-License-Identifier: MIT
# Blocking CI for the Halcyon simulation app.
# Stages (all blocking): lint → type-check → unit tests+coverage → security → image build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy --strict src/halcyon_sim

      - name: Unit tests + coverage
        run: uv run pytest -n auto -x --cov=halcyon_sim --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-extras

      - name: Bandit (SAST)
        run: uv run bandit -r src/halcyon_sim -ll

      - name: pip-audit (CVE check)
        run: uv run pip-audit

      - name: SPDX header check
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git ls-files 'app/src/*.py' 'app/tests/*.py' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            FILES=($(find src tests -name '*.py' | sort))
          fi
          MISSING=$(grep -L 'SPDX-License-Identifier' "${FILES[@]}" || true)
          if [ -n "$MISSING" ]; then
            echo "::error::Missing SPDX identifier in:"; echo "$MISSING"; exit 1
          fi

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build image
        uses: docker/build-push-action@67a2d409da98e93525b05b5bfa8f5f755eefd119 # v6.12.0
        with:
          context: app
          file: app/Dockerfile
          push: false
          tags: halcyon-sim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
